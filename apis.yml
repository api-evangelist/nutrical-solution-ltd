aid: nutrical-solution-ltd
name: Nutrical Solution Ltd
description: >-
  NutriCal (Nutrical Solution Ltd) is the GCC's food nutrition and intelligence
  platform, offering the region's first Saudi FDA / GCC-compliant food-label and
  calorie-analysis software. Its SaaS lets restaurants, cafes, hotels, food
  manufacturers, bakeries, catering companies, nutrition centres, and meal-plan
  businesses register products, generate bilingual (English/Arabic) nutrition
  and ingredient labels, manage and cost recipes, run nutrition analysis, and
  build customer meal plans against an ingredient database of 40,000+ foods
  sourced from USDA data and NutriCal's proprietary local database. NutriCal also
  exposes a Food & Nutrition API so apps, programs, and websites can search
  ingredients, create and analyze recipes, manage recipe categories, build meal
  plans, and read nutrient and allergen metadata. Backed by 500 Global.
